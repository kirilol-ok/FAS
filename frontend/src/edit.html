<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edycja Pracownika - Admin Panel</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="dashboard-container">
        <header class="dashboard-header">
            <div class="admin-info">
                <span class="admin-label">Administrator:</span>
                <span id="adminName" class="admin-name">Ładowanie...</span>
            </div>
            <div class="header-actions">
                <button id="backBtn" class="btn btn-secondary">Powrót</button>
                <button id="logoutBtn" class="btn btn-secondary">Wyloguj</button>
            </div>
        </header>

        <main class="dashboard-main">
            <div class="content-header">
                <h2>Edycja Pracownika</h2>
            </div>
            
            <div class="edit-card">
                <form id="editEmployeeForm">
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="employeeId">ID</label>
                            <input type="text" id="employeeId" name="id" readonly style="background: #f0f0f0;">
                        </div>
                        <div class="form-group">
                            <label for="firstName">Imię</label>
                            <input type="text" id="firstName" name="first_name" required>
                        </div>
                        <div class="form-group">
                            <label for="lastName">Nazwisko</label>
                            <input type="text" id="lastName" name="last_name" required>
                        </div>
                        <div class="form-group">
                            <label for="email">Email</label>
                            <input type="email" id="email" name="email" required>
                        </div>
                    </div>

                    <div style="margin-top: 20px; padding-top: 20px; border-top: 1px solid #eee;">
                        <h3 style="font-size: 16px; margin-bottom: 15px; color: #555;">Status zatrudnienia</h3>
                        <div class="form-grid">
                            <div class="form-group checkbox-group" style="display: flex; align-items: center; gap: 10px;">
                                <input type="checkbox" id="dismissCheckbox" style="width: auto;">
                                <label for="dismissCheckbox" style="margin: 0; cursor: pointer;">Zwolnij pracownika</label>
                            </div>
                            <div class="form-group" id="dismissDateGroup" style="display: none;">
                                <label for="dismissDate">Data zwolnienia</label>
                                <input type="date" id="dismissDate" name="dismissal_date">
                            </div>
                        </div>
                    </div>

                    <div class="form-message" id="formMessage"></div>
                    
                    <div class="form-actions">
                        <button type="button" id="deleteBtn" class="btn btn-danger" style="margin-right: auto;">Usuń Pracownika</button>
                        
                        <button type="button" id="cancelBtn" class="btn btn-cancel">Anuluj</button>
                        <button type="submit" id="saveBtn" class="btn btn-primary">Zapisz Zmiany</button>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="js/app.js"></script>
    <script src="js/edit.js"></script>
</body>
</html>
