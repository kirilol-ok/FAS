<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edycja Pracownika - Admin Panel</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="dashboard-container">
        <!-- Header -->
        <header class="dashboard-header">
            <div class="admin-info">
                <span class="admin-label">Administrator:</span>
                <span id="adminName" class="admin-name">Ładowanie...</span>
            </div>
            <div class="header-actions">
                <button id="backBtn" class="btn btn-secondary">Powrót</button>
                <button id="logoutBtn" class="btn btn-secondary">Wyloguj</button>
            </div>
        </header>

        <!-- Main Content -->
        <main class="dashboard-main">
            <div class="content-header">
                <h2>Edycja Pracownika</h2>
            </div>
            <div class="form-container">
                <form id="editEmployeeForm">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="employeeId">ID</label>
                            <input type="text" id="employeeId" name="id" readonly>
                        </div>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label for="firstName">Imię (First Name)</label>
                            <input type="text" id="firstName" name="first_name" required>
                        </div>
                        <div class="form-group">
                            <label for="lastName">Nazwisko (Last Name)</label>
                            <input type="text" id="lastName" name="last_name" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="email">Email</label>
                            <input type="email" id="email" name="email" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group checkbox-group">
                            <label>
                                <input type="checkbox" id="dismissCheckbox">
                                Zwolnij pracownika (Dismiss)
                            </label>
                        </div>
                        <div class="form-group" id="dismissDateGroup" style="display: none;">
                            <label for="dismissDate">Data zwolnienia</label>
                            <input type="date" id="dismissDate" name="dismissal_date">
                        </div>
                    </div>

                    <div class="form-message" id="formMessage"></div>
                </form>
            </div>
        </main>

        <!-- Footer with Actions -->
        <footer class="dashboard-footer">
            <button id="deleteBtn" class="btn btn-danger">Usuń (DELETE)</button>
            <button id="saveBtn" class="btn btn-primary">Zapisz (PUT)</button>
        </footer>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="js/app.js"></script>
    <script src="js/edit.js"></script>
</body>
</html>
