<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raporty - Admin Panel</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="dashboard-container">
        <!-- Header -->
        <header class="dashboard-header">
            <div class="admin-info">
                <span class="admin-label">Administrator:</span>
                <span id="adminName" class="admin-name">Ładowanie...</span>
            </div>
            <div class="header-actions">
                <button id="backBtn" class="btn btn-secondary">Powrót</button>
                <button id="logoutBtn" class="btn btn-secondary">Wyloguj</button>
            </div>
        </header>

        <!-- Main Content -->
        <main class="dashboard-main">
            <div class="content-header">
                <h2>Generowanie Raportów</h2>
            </div>
            
            <!-- Filters Form -->
            <div class="form-container">
                <form id="reportFiltersForm">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="employeeSelect">ID Pracownika</label>
                            <select id="employeeSelect" name="employee_id">
                                <option value="">Wszyscy pracownicy</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="dateFrom">Data od (Date From)</label>
                            <input type="datetime-local" id="dateFrom" name="date_from" required>
                        </div>
                        <div class="form-group">
                            <label for="dateTo">Data do (Date To)</label>
                            <input type="datetime-local" id="dateTo" name="date_to" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group checkbox-group">
                            <label>
                                <input type="checkbox" id="lockUnlockFilter">
                                Tylko zdarzenia zamknięcia/otwarcia (Lock/Unlock)
                            </label>
                        </div>
                    </div>
                </form>
            </div>

            <!-- Generate Button -->
            <div style="text-align: center; margin: 20px 0;">
                <button id="generateReportBtn" class="btn btn-primary btn-large">
                    Generuj Raport (GET)
                </button>
            </div>

            <!-- Reports Table -->
            <div class="content-header" style="margin-top: 30px;">
                <h2>Wyniki Raportu</h2>
            </div>
            <div id="reportsTableContainer" class="table-container">
                <p class="loading">Wybierz filtry i kliknij "Generuj Raport"</p>
            </div>
        </main>

        <!-- Footer -->
        <footer class="dashboard-footer">
            <button id="closeReportBtn" class="btn btn-secondary">Zamknij Raport (Close)</button>
        </footer>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="js/app.js"></script>
    <script src="js/reports.js"></script>
</body>
</html>
