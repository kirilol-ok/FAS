<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raporty - Admin Panel</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="dashboard-container">
        <header class="dashboard-header">
            <div class="admin-info">
                <span class="admin-label">Administrator:</span>
                <span id="adminName" class="admin-name">Ładowanie...</span>
            </div>
            <div class="header-actions">
                <button id="backBtn" class="btn btn-secondary">Powrót</button>
                <button id="logoutBtn" class="btn btn-secondary">Wyloguj</button>
            </div>
        </header>

        <main class="dashboard-main">
            <div class="content-header">
                <h2>Generowanie Raportów</h2>
            </div>
            
            <div class="reports-card">
                <form id="reportFiltersForm" class="reports-filters">
                    <div class="filter-group">
                        <label for="employeeSelect">Pracownik</label>
                        <select id="employeeSelect" name="employee_id">
                            <option value="">Wszyscy pracownicy</option>
                        </select>
                    </div>

                    <div class="filter-group">
                        <label for="dateFrom">Data od</label>
                        <input type="datetime-local" id="dateFrom" name="date_from" required>
                    </div>

                    <div class="filter-group">
                        <label for="dateTo">Data do</label>
                        <input type="datetime-local" id="dateTo" name="date_to" required>
                    </div>
                    
                    <div class="filter-group" style="flex: 0 0 auto;">
                        <button type="submit" id="generateReportBtn" class="btn btn-primary">
                            Generuj Raport
                        </button>
                    </div>
                </form>

                <div style="margin-top: 15px;">
                    <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                        <input type="checkbox" id="lockUnlockFilter">
                        <span style="font-size: 14px; color: #555;">Pokaż tylko zdarzenia wejścia/wyjścia (Lock/Unlock)</span>
                    </label>
                </div>
            </div>

            <div class="content-header" style="margin-top: 30px;">
                <h2>Wyniki Raportu</h2>
            </div>
            
            <div id="reportsTableContainer" class="report-results-container">
                <p class="loading">Wybierz zakres dat i kliknij "Generuj Raport"</p>
            </div>
        </main>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="js/app.js"></script>
    <script src="js/reports.js"></script>
</body>
</html>
