<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camera Live View</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="dashboard-container">
        <header class="dashboard-header">
            <div class="admin-info">
                <span class="admin-label">Camera View</span>
                <span class="admin-name">Live Stream</span>
            </div>
            <div class="header-actions">
                <button id="backBtn" class="btn btn-secondary" onclick="window.history.back()">Back</button>
            </div>
        </header>

        <main class="dashboard-main">
            <div class="content-header">
                <h2>Camera Live View</h2>
                <h2 id="detectedName" style="color: #3b82f6; min-height: 1.5em; text-align: center;">---</h2>
                
                <div class="status" id="status">
                    <span class="status-dot"></span>
                    <span id="statusText">System Active</span>
                </div>
            </div>

            <div class="video-container">
                <img id="videoStream" src="http://localhost:8090/video" style="width: 100%; height: 100%; object-fit: contain;">
            </div>

            </main>
    </div>

    <script src="/static/js/camera.js"></script>
</body>
</html>
