<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Employee - Admin Panel</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="dashboard-container">
        <header class="dashboard-header">
            <div class="admin-info">
                <span class="admin-label">Administrator:</span>
                <span id="adminName" class="admin-name">Loading...</span>
            </div>
            <div class="header-actions">
                <button id="backBtn" class="btn btn-secondary">Back</button>
            </div>
        </header>

        <main class="dashboard-main">
            <div class="content-header">
                <h2>Add New Employee</h2>
            </div>
            
            <div class="edit-card">
                <form id="addEmployeeForm" onsubmit="return false;">
                    
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="firstName">First Name</label>
                            <input type="text" id="firstName" name="first_name" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="lastName">Last Name</label>
                            <input type="text" id="lastName" name="last_name" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="email">Email</label>
                            <input type="email" id="email" name="email" required>
                        </div>

                        <div class="form-group">
                            <label for="hireDate">Hire Date</label>
                            <input type="date" id="hireDate" name="hire_date" required>
                        </div>

                        <div class="form-group">
                            <label for="expirationDate">Expiration Date (Optional)</label>
                            <input type="date" id="expirationDate" name="expiration_date">
                            <small style="color: #666; font-size: 0.8em;">Leave empty/clear for +6 months default</small>
                        </div>
                    </div>

                    

                    <div class="form-message" id="formMessage"></div>
                    
                    <div class="form-actions">
                        <button type="button" id="cancelBtn" class="btn btn-cancel">Cancel</button>
                        
                        <button type="button" id="addBtn" class="btn btn-primary">Add Employee</button>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    
    <script src="js/app.js"></script> <script src="js/add.js"></script> </body>
</html>
