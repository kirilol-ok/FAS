services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.backend
    container_name: backend_dev
    env_file:
      - .env
    working_dir: /app/backend
    volumes:
      - ./backend:/app/backend
      - ./.git:/app/.git:ro
    depends_on:
      - postgres
    stdin_open: true
    tty: true
    command: bash
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile.frontend
    container_name: frontend_dev
    working_dir: /app
    volumes:
      - ./frontend:/app
      - ./.git:/app/.git:ro
    depends_on:
      - backend
    stdin_open: true
    tty: true
    command: sh
    ports:
      - "5173:5173"

  postgres:
    image: postgres:16
    container_name: postgres_databases
    restart: unless-stopped
    environment:
      POSTGRES_DB: raports
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
