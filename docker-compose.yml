services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.backend
    container_name: backend_dev
    env_file:
      - .env
    working_dir: /app
    volumes:
      - ./:/app
    depends_on:
      - postgres
    stdin_open: true
    tty: true
    command: sh -c "uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload & exec bash" 
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile.frontend
    container_name: frontend_dev
    working_dir: /app
    volumes:
      - ./frontend:/app
      - ./.git:/app/.git:rw
      - ./.gitignore:/app/.gitignore:rw
      - ./.env:/app/.env:rw
    depends_on:
      - backend
    stdin_open: true
    tty: true
    ports:
      - "3000:3000"

  postgres:
    image: postgres:16
    container_name: postgres_databases
    restart: unless-stopped
    environment:
      POSTGRES_DB: fas-project-database
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
