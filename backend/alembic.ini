[alembic]
# The directory where Alembic's migration environment lives.  This is
# relative to the location of this configuration file.  The default
# env.py file in ``backend/alembic`` imports your models and metadata.
script_location = alembic

# Configure multiple version directories for different backends.  Alembic
# supports multiple ``version_locations`` separated by os.pathsep (":" on Unix).
# When a revision is generated with ``--name`` set to ``postgres`` or ``sqlite``,
# Alembic will place the migration in the corresponding directory.  This
# keeps Postgres and SQLite migrations separate while sharing the same
# ``env.py`` and metadata.
version_locations = %(here)s/backend/alembic/versions_postgres:%(here)s/backend/alembic/versions_sqlite
version_path_separator = :

[postgres]
script_location = alembic
version_locations = alembic/versions_postgres
version_path_separator = os
sqlalchemy.url = postgresql+psycopg://admin:admin@postgres_databases:5432/fas-project-database

[sqlite]
script_location = alembic
version_locations = alembic/versions_sqlite
version_path_separator = os
sqlalchemy.url = sqlite:////app/backend/databases/app.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s